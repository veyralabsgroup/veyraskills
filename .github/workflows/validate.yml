name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "validate.js"
  pull_request:
    paths:
      - "skills/**"
      - "validate.js"

jobs:
  validate:
    name: Validate skill definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validator
        run: node validate.js
